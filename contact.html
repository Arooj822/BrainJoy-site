<main class="wrap page-body">
  <h1>Get in touch</h1>
  <p>Questions, topic requests, or want to collaborate? Send a message below, or email us directly at <a href="mailto:info@brainjoy.site" style="color:var(--violet-deep);font-weight:600;">info@brainjoy.site</a>.</p>

  <form class="contact-form" action="mailto:info@brainjoy.site" method="post" enctype="text/plain">
    <div>
      <label for="name">Name</label><br/>
      <input type="text" id="name" name="name" placeholder="Your name" required />
    </div>
    <div>
      <label for="email">Email</label><br/>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />
    </div>
    <div>
      <label for="message">Message</label><br/>
      <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary" style="align-self:flex-start;">Send message</button>
  </form>
</main>
