name: BrainJoy release bx (client-local tools)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brainjoy-pages-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rebuild the hash-verified bw release, then overlay the bx files
        shell: bash
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          curl -fsSL "https://raw.githubusercontent.com/$REPO/$SHA/.github/workflows/brainjoy-allowlisted-pages.yml" -o old.yml
          python3 - <<'PYX'
          import hashlib, yaml
          raw = open('old.yml','rb').read()
          if hashlib.sha256(raw).hexdigest() != '4880c38190b9e2715ed80eead17597472edb71d033ea68d8073becdc4dffe28a':
              raise RuntimeError('Base release workflow changed')
          wf = yaml.safe_load(raw)
          open('base-step.sh','w').write(wf['jobs']['build']['steps'][0]['run'])
          PYX
          bash base-step.sh
          python3 - <<'PYY'
          import base64, gzip, hashlib, pathlib
          OVERLAY = {
