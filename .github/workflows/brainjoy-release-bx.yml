name: BrainJoy release bx (client-local tools)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brainjoy-pages-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rebuild the hash-verified bw release, then overlay the bx files
        shell: bash
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          curl -fsSL "https://raw.githubusercontent.com/$REPO/$SHA/.github/workflows/brainjoy-allowlisted-pages.yml" -o old.yml
          python3 - <<'PYX'
          import hashlib, yaml
          raw = open('old.yml','rb').read()
          if hashlib.sha256(raw).hexdigest() != '4880c38190b9e2715ed80eead17597472edb71d033ea68d8073becdc4dffe28a':
              raise RuntimeError('Base release workflow changed')
          wf = yaml.safe_load(raw)
          open('base-step.sh','w').write(wf['jobs']['build']['steps'][0]['run'])
          PYX
          bash base-step.sh
          python3 - <<'PYY'
          import base64, gzip, hashlib, pathlib
          OVERLAY = {
            'index.html': {'sha256': '1c880fd95c680d3fa44b69e969de1fc10cc84104b49801133ce11107a504d906', 'gzip': ''},
            'interactive-worksheet.html': {'sha256': '7aab4d60f4ca1adc928dfc429685e391fef851d91f6062e404a740dd5a2df3fb', 'gzip': ''},
            'interactive-worksheet.js': {'sha256': '772cbe1a58f27a21d4765840635f932c05f2ec538c40d25c807249436b4f5454', 'gzip': ''},
            'platform/app/classroom.css': {'sha256': '2c0ac2909be4e2d4d6aaaf6f0ce72c38d474f5b917b898f8845fe6443a70b56e', 'gzip': ''},
            'platform/app/feedback.css': {'sha256': '25ba4df0ef9f7174978a94b54f45ac5c0f7728fd1568f0499dc36e3b9672ba47', 'gzip': 'H4sIAAAAAAAC/1WPwW6DMBBE7/0KS1GOtkyAUJmvMXgBS8aLlm2dyMq/J6UtSS5z2H0zO6uGThKm3CE5IMm4mGK5iBWDd+IAZ9cPZbtY53wcjfokmIVu8RtoCJhkIrsYG69pAoKb+s0SKk2W84CRZQI/TmwardseA5I5VOVJN3U7Wxp9NPppmoFt/hur03ZI7K66qeBc7/AKAXp+0BeZvOPJFFof/zNVuZl3uPtixpjftqra9IUMfuX8I3LlawATMcL+uH72/bgD71WysjIBAAA='},
            'platform/app/i18n-core.js': {'sha256': '27fc17d7357a866b2f719c40a36bc1450fd663dbfe5bde6759f9d85c8505332c', 'gzip': ''},
            'platform/app/notices.css': {'sha256': '66e8a63ac586138784f667eeb02d291864852998ae9c4ded8af873eefd7fa9a2', 'gzip': ''},
            'platform/app/question-bank-v2-core.js': {'sha256': '3fff2975da98ced2b19147ae72fbb77d66b8d81ddb24cffee69997ff1896dae3', 'gzip': ''},
            'platform/app/question-destinations.js': {'sha256': '8f431039e9a91fa091a2179133b64f2bad442c3fc512c67f446bc34dcc9259e6', 'gzip': ''},
            'platform/app/question-types-core.js': {'sha256': '93f1f2ec507bd73dcb557144faa1089cd9148866aaafeb5296aecc76d9b9930d', 'gzip': ''},
            'platform/app/typed-author-config.js': {'sha256': 'a3c0d7716df28c0774a5983367313b90936d2702a92967e0313569dc8f43af81', 'gzip': 'H4sIAAAAAAAC/w3MwWrCQBSF4b1PcZYt2LivuEgLtXGRQNBFV3KdnJipw1yZuTGi9N2b5Q8/32qFloGS2cEFz2hvQZ0EmGooUCvEOR2jLZFNk5y5RKRNmi7QhLJaI6oNPp7hM7LcZod3x6tB0PtA2EDIaMN8u0E1M882Op1iUOmKxeTjHMVHW1b1rvk5lof9d9MeP5v6q9pumtMvnRV9Ih98eTLKKbB7tzTy73W9+AelDhC/vwAAAA=='},
            'platform/app/typed-author-i18n.js': {'sha256': '093bec20bb1742eef3719603c72d0abe35f7b8afe5185e3bebe4d89d73b0906d', 'gzip': ''},
            'platform/app/typed-author.css': {'sha256': '2d56dff0e5e46c85a63fb96e84588686e11698ac8fc796558b03ba79e5dee6f1', 'gzip': ''},
            'platform/app/typed-author.html': {'sha256': '6916770c527ee3112a59a680598f045dc1428b4ba188a70669894723bc801c6d', 'gzip': ''},
            'platform/app/typed-author.js': {'sha256': '5b0352b03c76c54b122a4869657f4aed9c7c3616e3589e41ed319f25b19494de', 'gzip': ''},
            'platform/app/typed-bank-config.js': {'sha256': 'b3b028f2eb17cb40a460d265637c9f1f3cbee35a8522d0c1168d063d47ad9747', 'gzip': 'H4sIAAAAAAAC/w3MwWrCQBSF4b1PcZYVbNwrXcRWJRYSkW5chevkaKYd5srMjSktffdm+cPPt1zixEDJ7OCCZ7TnoE4CTDUUqBXinA7RFsimSW5cINJGTV/QhLJaI6r1Pt7gM7I8JoffjneD4OoDYT0hg/XT7XrVzDzZ6HSMQaUrZqOPUxSbU1nVh+bcfpyP27d2U9bv7WtT76r9S3P5pLPimsgfPv0yyiWwW1ka+Ddfz/4B7Pv0L8MAAAA='},
            'platform/app/typed-bank-i18n.js': {'sha256': '671871533c883e7790b79c8041f7ded7e316f2dd9024718ee82a3d45a7dde454', 'gzip': ''},
            'platform/app/typed-bank.html': {'sha256': 'f74a426bbd86f4ca7311b7525f0589f48ed431b16878c563be2b8f95e0cdc5c5', 'gzip': ''},
            'platform/app/typed-bank.js': {'sha256': '80cbc9ee77d4df7cbf4b1bd88f180f7f648fc37d4e3a80aa6cbd19a9dbef5ac5', 'gzip': ''},
            'platform/app/typed-set-core.js': {'sha256': '4e66534e31b984f3d0e499e21ffe6db3ccb73d3f15185aff66be0cc66e51d68c', 'gzip': ''},
            'platform/app/types-preview-config.js': {'sha256': '8aee5edf272c9f65a28f3a91e3689b8f687dbddac769a4e1ac4e08976297befb', 'gzip': 'H4sIAAAAAAAC/xWMsW7CQBBEe75iyyAR04MoSBQiU9gI0lCh4zx2Fo5ddLfGkCj/nqMbzbx50yltEeASGvKBIfYa1LtA14gbY6A+sXTU8j0DLXtjlbwmd7kGEBsuqaBKyXmvvdiEkml0HSYksEHjmTTSspyTqH0/TZzy+ZZluU9e41Obo5OHCorRwNLoULxtl2W1rveHr/3mY3d4r6tV+bmojyd4K9oI/ODlF+KOAc3MYo+/8Xz0D5xGzvPMAAAA'},
            'platform/app/types-preview.html': {'sha256': 'f354881a2c0b51a481d449f042e7709a47383d183d20cb1d03f8306beaab51bd', 'gzip': ''},
            'platform/app/types-preview.js': {'sha256': '74fbbb93962a30096ef201755813ccc6c1e2777749588ec099028f4ed130ed81', 'gzip': ''},
            'resource-library.html': {'sha256': '4047ff52bb67c9257d5f561e4bef4f3c0f7fe616d27ab1fec8642536a4c31517', 'gzip': ''},
          }
          OUT = pathlib.Path('_site')
          for name, item in OVERLAY.items():
              if name.startswith('/') or '..' in pathlib.PurePosixPath(name).parts:
                  raise RuntimeError('Unsafe path')
              data = gzip.decompress(base64.b64decode(item['gzip']))
              if hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise RuntimeError('Overlay hash mismatch: ' + name)
              target = OUT / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          cfg = (OUT / 'platform/app/config.js').read_text()
          if '"enabled": false' not in cfg or '"liveEnabled": false' not in cfg:
              raise RuntimeError('Master config is not closed')
          if any(OUT.rglob('.env')) or (OUT / 'product-masters').exists() or (OUT / 'tests').exists():
              raise RuntimeError('Unexpected private or archive artifact')
          print('Overlay applied:', len(OVERLAY), 'files. Master config closed.')
          PYY
      - name: Package verified Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish client-local tools release
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
