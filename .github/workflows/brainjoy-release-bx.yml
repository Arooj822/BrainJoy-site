            'simulations.html': {'sha256': '700099c1115a6876ab7d5ec20876d04153f8916ae28755cd7c33a417ba59e891', 'gzip': ''},
            'electron-config-lab.html': {'sha256': '0b4d09fa11ae3ed34d033edb6a2423b6f0c94290b36b16a9833ba205c7738689', 'gzip': ''},
