            "platform/app/typed-bank.html": "f74a426bbd86f4ca7311b7525f0589f48ed431b16878c563be2b8f95e0cdc5c5",
            "platform/app/typed-bank.js": "80cbc9ee77d4df7cbf4b1bd88f180f7f648fc37d4e3a80aa6cbd19a9dbef5ac5",
            "platform/app/typed-set-core.js": "4e66534e31b984f3d0e499e21ffe6db3ccb73d3f15185aff66be0cc66e51d68c",
            "platform/app/types-preview-config.js": "8aee5edf272c9f65a28f3a91e3689b8f687dbddac769a4e1ac4e08976297befb",
            "platform/app/types-preview.html": "f354881a2c0b51a481d449f042e7709a47383d183d20cb1d03f8306beaab51bd",
            "platform/app/types-preview.js": "74fbbb93962a30096ef201755813ccc6c1e2777749588ec099028f4ed130ed81",
            "resource-library.html": "034a435ceda993a66fd3cd6dfa28c564a5425a40d85c997a64bafe689e2c319a",
            "simulations.html": "700099c1115a6876ab7d5ec20876d04153f8916ae28755cd7c33a417ba59e891",
            "electron-config-lab.html": "0b4d09fa11ae3ed34d033edb6a2423b6f0c94290b36b16a9833ba205c7738689",
            "quiz-builder.html": "25dbf914db9d7e1c1483e523050671b6f5f26638300f80f9f4e279c559eb97cc",
            "sim-build-atom.html": "eb5bfe29771ae2306aafe336c3c81ef96b90b93b050e3d0ade4bc23e4ffac0ab"
          }
          BLOBS = json.loads(lzma.decompress(base64.b64decode('')).decode())
          OUT = pathlib.Path('_site')
          for name, item in OVERLAY.items():
              if name.startswith('/') or '..' in pathlib.PurePosixPath(name).parts:
                  raise RuntimeError('Unsafe path')
              data = BLOBS[name].encode()
              if hashlib.sha256(data).hexdigest() != item:
                  raise RuntimeError('Overlay hash mismatch: ' + name)
              target = OUT / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          cfg = (OUT / 'platform/app/config.js').read_text()
          if '"enabled": false' not in cfg or '"liveEnabled": false' not in cfg:
              raise RuntimeError('Master config is not closed')
          if any(OUT.rglob('.env')) or (OUT / 'product-masters').exists() or (OUT / 'tests').exists():
              raise RuntimeError('Unexpected private or archive artifact')
          print('Overlay applied:', len(OVERLAY), 'files. Master config closed.')
          PYY
      - name: Package verified Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish client-local tools release
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
