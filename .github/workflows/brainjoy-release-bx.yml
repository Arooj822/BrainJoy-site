          }
          OUT = pathlib.Path('_site')
          for name, item in OVERLAY.items():
              if name.startswith('/') or '..' in pathlib.PurePosixPath(name).parts:
                  raise RuntimeError('Unsafe path')
              data = gzip.decompress(base64.b64decode(item['gzip']))
              if hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise RuntimeError('Overlay hash mismatch: ' + name)
              target = OUT / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          cfg = (OUT / 'platform/app/config.js').read_text()
          if '"enabled": false' not in cfg or '"liveEnabled": false' not in cfg:
              raise RuntimeError('Master config is not closed')
          if any(OUT.rglob('.env')) or (OUT / 'product-masters').exists() or (OUT / 'tests').exists():
              raise RuntimeError('Unexpected private or archive artifact')
          print('Overlay applied:', len(OVERLAY), 'files. Master config closed.')
          PYY
      - name: Package verified Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish client-local tools release
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
