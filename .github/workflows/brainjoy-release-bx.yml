name: BrainJoy release bx (client-local tools)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brainjoy-pages-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rebuild the hash-verified bw release, then overlay the bx files
        shell: bash
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          curl -fsSL "https://raw.githubusercontent.com/$REPO/$SHA/.github/workflows/brainjoy-allowlisted-pages.yml" -o old.yml
          python3 - <<'PYX'
          import hashlib, yaml
          raw = open('old.yml','rb').read()
          if hashlib.sha256(raw).hexdigest() != '4880c38190b9e2715ed80eead17597472edb71d033ea68d8073becdc4dffe28a':
              raise RuntimeError('Base release workflow changed')
          wf = yaml.safe_load(raw)
          open('base-step.sh','w').write(wf['jobs']['build']['steps'][0]['run'])
          PYX
          bash base-step.sh
          python3 - <<'PYY'
          import base64, gzip, hashlib, pathlib
          import lzma, json
          OVERLAY = {
            "sim-reaction-rates.html": "6c202a2d06b9b8dc16499e44c0a8af70eba4fd20f9951ca892d6b5c6a866277b",
            "conductivity-lab.html": "4f9cd5a550db861b34c047ec451cfc3bdb7731f64f0ff06d7c9134668dbecc22",
            "wastewater-neutralization.html": "96b021892ab4242761dedf94c23eb6b1030dfa5063865995a821353c36241266",
            "titration-lab.html": "bdf80a257c2b2f142fa6c9b1e96ae5a7fd06927a2a9d0717b4373fc272f23d8e",
            "sim-titration.html": "fab2737cfc97e67d7b736b7e18fae90b7a4816a328f15a2b9b8ebb06aae80d15",
            "sim-ph-scale.html": "b13349cf647d07b965dd39a966e43e6c8f37e99b5da1ffdc043f8792a5d3ac12",
            "sim-atomic-models.html": "3eab2b789b721ac1eff37da3c81d64406a28eb74556479aa0e61f3c97c4ca0b8",
            "ph-scale-litmus.html": "838e8d347fc96efabf6f3882951e96e46de734986b1b42c3dc22c06f72b571f5",
            "multi-step-conversion.html": "05458cf89d109429fd6ff619820dbed432b08efa53aa64ac8992ae30708c39da",
            "graphite-challenge.html": "fa5315603b7fd20b414d28ab2c1d9b2d3d153f2ab86c19ea8fbab74b15c472b0",
            "enzyme-ph.html": "c034b44a84650cf29a6e03237cdd0ac02fcd5af3ade5754d6be97f051219f8f7",
            "dissociation-conductivity.html": "14993559ce4d4ea03b47892df129add530871a9ab20a8e868f6228e705f8fc59",
            "counting-invisible.html": "6cbd928f6c3700fb240ee0206b447beb2a3d6bef65e43b501fba15c5cd2fba92",
            "mole-conversion-builder.html": "751964a52041fa4f97815e16f4ad1515d93351816f79c1b998233cdf5426a180",
            "equal-moles.html": "01970450cf7087e2fb4ba94a3c58ef463ce425674701b16f2c2772d520aea157",
