<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - BrainJoy</title>
    <!-- Stable CDN version -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="SignUp_LogIn_Form.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
      .back-link {
        position: absolute;
        top: 20px;
        left: 30px;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        z-index: 2000;
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 15px;
        background: rgba(255,255,255,0.15);
        border-radius: 20px;
        transition: 0.3s;
      }
      .back-link:hover { 
          background: rgba(255,255,255,0.3);
      }
    </style>
</head>
<body>
    <a href="index.html" class="back-link"><i class='bx bx-left-arrow-alt'></i> Back to Home</a>
    
    <div class="container" id="container">
        <!-- LOGIN FORM -->
        <div class="form-box login">
            <form id="loginForm">
                <h1>Login</h1>
                
                <div class="role-selector" id="loginRoleSelector">
                    <div class="role-btn active" data-role="student">Student</div>
                    <div class="role-btn" data-role="teacher">Teacher</div>
                    <div class="role-btn" data-role="parent">Parent</div>
                    <div class="role-btn" data-role="admin">Admin</div>
                </div>

                <div class="input-box">
                    <input type="text" id="loginEmail" placeholder="Email" required>
                    <i class='bx bxs-envelope'></i>
                </div>
                <div class="input-box">
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <i class='bx bxs-lock-alt' ></i>
                </div>
                <div class="forgot-link">
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <div id="loginMessage" style="text-align:center; margin-top:5px; font-size:14px; min-height: 20px;"></div>
                <p>or login with social platforms</p>
                <div class="social-icons">
                    <a href="#"><i class='bx bxl-google' ></i></a>
                    <a href="#"><i class='bx bxl-facebook' ></i></a>
                    <a href="#"><i class='bx bxl-github' ></i></a>
                    <a href="#"><i class='bx bxl-linkedin' ></i></a>
                </div>
            </form>
        </div>

        <!-- REGISTRATION FORM -->
        <div class="form-box register">
            <form id="registerForm">
                <h1>Registration</h1>
                
                <div class="role-selector" id="regRoleSelector">
                    <div class="role-btn active" data-role="student">Student</div>
                    <div class="role-btn" data-role="teacher">Teacher</div>
                    <div class="role-btn" data-role="parent">Parent</div>
                    <div class="role-btn" data-role="admin">Admin</div>
                </div>

                <div class="input-box" style="margin-top: 5px;">
                    <input type="text" id="regName" placeholder="Username" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="email" id="regEmail" placeholder="Email" required>
                    <i class='bx bxs-envelope' ></i>
                </div>
                <div class="input-box">
                    <input type="password" id="regPassword" placeholder="Password" required>
                    <i class='bx bxs-lock-alt' ></i>
                </div>
                <button type="submit" class="btn">Register</button>
                <div id="regMessage" style="text-align:center; margin-top:5px; font-size:14px; min-height: 20px;"></div>
                <p>or register with social platforms</p>
                <div class="social-icons">
                    <a href="#"><i class='bx bxl-google' ></i></a>
                    <a href="#"><i class='bx bxl-facebook' ></i></a>
                    <a href="#"><i class='bx bxl-github' ></i></a>
                    <a href="#"><i class='bx bxl-linkedin' ></i></a>
                </div>
            </form>
        </div>

        <!-- TOGGLE BOX -->
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Hello, Welcome!</h1>
                <p>Don't have an account?</p>
                <button class="btn register-btn">Register</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>Welcome Back!</h1>
                <p>Already have an account?</p>
                <button class="btn login-btn">Login</button>
            </div>
        </div>
    </div>

    <!-- Auth script -->
    <script src="SignUp_LogIn_Form.js"></script>
</body>
</html>
